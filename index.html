<div class="form-group">

    <label>
        Phone / WhatsApp
    </label>

    <div class="phone-row">

        <select
            name="Country Code"
            aria-label="Country code">

            <option value="+971" selected>
                🇦🇪 +971
            </option>

            <option value="+91">
                🇮🇳 +91
            </option>

            <option value="+966">
                🇸🇦 +966
            </option>

            <option value="+974">
                🇶🇦 +974
            </option>

            <option value="+973">
                🇧🇭 +973
            </option>

            <option value="+965">
                🇰🇼 +965
            </option>

            <option value="+968">
                🇴🇲 +968
            </option>

            <option value="+44">
                🇬🇧 +44
            </option>

            <option value="+1">
                🇺🇸 +1
            </option>

        </select>

        <input
            type="tel"
            name="Phone"
            placeholder="50 123 4567">

    </div>

</div>
