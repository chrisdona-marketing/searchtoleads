<!DOCTYPE html>
<html lang="en">
<head>

<!-- Google Tag Manager -->
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-KGSCC247');</script>
<!-- End Google Tag Manager -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ page.title | default: "SearchToLeads" }}</title>

<meta name="description" content="{{ page.description | default: 'Digital marketing consultancy in Dubai helping UAE businesses with marketing strategy, SEO, AEO, GEO, performance marketing and lead generation.' }}">

<meta name="robots" content="index, follow, max-image-preview:large">

{% if page.canonical %}
<link rel="canonical" href="{{ page.canonical }}">
{% endif %}

<meta property="og:type" content="{{ page.og_type | default: 'website' }}">
<meta property="og:title" content="{{ page.title | default: 'SearchToLeads' }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:url" content="{{ page.canonical }}">
<meta property="og:site_name" content="SearchToLeads">

{% if page.og_image %}
<meta property="og:image" content="{{ page.og_image }}">
{% endif %}

<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="/style.css">

{% if page.layout == "blog-post" %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/blogs/blog-article.css">
{% endif %}

{% if page.schema %}
<script type="application/ld+json">
{{ page.schema }}
</script>
{% endif %}

</head>

<body class="{{ page.body_class }}">

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KGSCC247"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

{% include header.html %}

<main>
{{ content }}
</main>

{% include footer.html %}

<script>
document.querySelectorAll(".lead-form").forEach(function(form){
  form.addEventListener("submit", function(){
    const code = form.querySelector(".country-code");
    const phone = form.querySelector(".phone-number");
    const full = form.querySelector(".full-phone");

    if(code && phone && full){
      full.value = phone.value.trim()
        ? code.value + " " + phone.value.trim()
        : "";
    }
  });
});
</script>

</body>
</html>
