<!-- =====================================================
     LEAD FORM PHONE SCRIPT
     ===================================================== -->

<script>
document
  .querySelectorAll(".lead-form")
  .forEach(function(form){

    form.addEventListener(
      "submit",
      function(){

        const code =
          form.querySelector(".country-code");

        const phone =
          form.querySelector(".phone-number");

        const full =
          form.querySelector(".full-phone");


        if(code && phone && full){

          full.value =
            phone.value.trim()
            ? code.value + " " + phone.value.trim()
            : "";

        }

      }
    );

  });
</script>


<!-- =====================================================
     MOBILE NAVIGATION
     ===================================================== -->

<script>
document.addEventListener(
  "DOMContentLoaded",
  function(){

    const menuToggle =
      document.querySelector(
        ".mobile-menu-toggle"
      );

    const primaryNav =
      document.querySelector(
        ".primary-nav"
      );

    const servicesDropdown =
      document.querySelector(
        ".nav-dropdown"
      );

    const servicesToggle =
      document.querySelector(
        ".services-toggle"
      );


    /* MAIN HAMBURGER */

    if(menuToggle && primaryNav){

      menuToggle.addEventListener(
        "click",
        function(){

          const isOpen =
            primaryNav.classList.toggle(
              "is-open"
            );


          menuToggle.classList.toggle(
            "is-open",
            isOpen
          );


          menuToggle.setAttribute(
            "aria-expanded",
            isOpen ? "true" : "false"
          );

        }
      );

    }


    /* SERVICES DROPDOWN */

    if(
      servicesToggle &&
      servicesDropdown
    ){

      servicesToggle.addEventListener(
        "click",
        function(event){

          if(
            window.innerWidth <= 900
          ){

            event.preventDefault();


            servicesDropdown
              .classList
              .toggle("is-open");


            servicesToggle
              .setAttribute(
                "aria-expanded",

                servicesDropdown
                  .classList
                  .contains("is-open")
                  ? "true"
                  : "false"
              );

          }

        }
      );

    }


    /* CLOSE MOBILE MENU AFTER LINK CLICK */

    document
      .querySelectorAll(
        ".primary-nav > a, .dropdown-menu a"
      )
      .forEach(function(link){

        link.addEventListener(
          "click",
          function(){

            if(
              window.innerWidth <= 900
            ){

              if(primaryNav){
                primaryNav
                  .classList
                  .remove("is-open");
              }


              if(menuToggle){

                menuToggle
                  .classList
                  .remove("is-open");

                menuToggle
                  .setAttribute(
                    "aria-expanded",
                    "false"
                  );

              }


              if(servicesDropdown){

                servicesDropdown
                  .classList
                  .remove("is-open");

              }


              if(servicesToggle){

                servicesToggle
                  .setAttribute(
                    "aria-expanded",
                    "false"
                  );

              }

            }

          }
        );

      });


    /* DESKTOP RESET */

    window.addEventListener(
      "resize",
      function(){

        if(
          window.innerWidth > 900
        ){

          if(primaryNav){
            primaryNav
              .classList
              .remove("is-open");
          }


          if(menuToggle){

            menuToggle
              .classList
              .remove("is-open");

            menuToggle
              .setAttribute(
                "aria-expanded",
                "false"
              );

          }


          if(servicesDropdown){

            servicesDropdown
              .classList
              .remove("is-open");

          }


          if(servicesToggle){

            servicesToggle
              .setAttribute(
                "aria-expanded",
                "false"
              );

          }

        }

      }
    );

  }
);
</script>


<!-- =====================================================
     SITE SEARCH
     ===================================================== -->

<script>
document.addEventListener(
  "DOMContentLoaded",
  function(){

    const searchToggle =
      document.querySelector(
        ".header-search-toggle"
      );

    const searchPanel =
      document.getElementById(
        "site-search-panel"
      );

    const searchClose =
      document.querySelector(
        ".site-search-close"
      );

    const searchInput =
      document.getElementById(
        "site-search-input"
      );

    const searchResults =
      document.getElementById(
        "site-search-results"
      );

    const searchStatus =
      document.getElementById(
        "site-search-status"
      );

    const primaryNav =
      document.querySelector(
        ".primary-nav"
      );

    const menuToggle =
      document.querySelector(
        ".mobile-menu-toggle"
      );


    let searchData = [];

    let searchLoaded = false;


    /* LOAD SEARCH INDEX */

    async function loadSearchData(){

      if(searchLoaded){
        return;
      }


      if(searchStatus){

        searchStatus.textContent =
          "Loading search...";

      }


      try{

        const response =
          await fetch(
            "/search.json"
          );


        if(!response.ok){

          throw new Error(
            "Search index could not be loaded."
          );

        }


        searchData =
          await response.json();


        searchLoaded = true;


        if(searchStatus){

          searchStatus.textContent =
            "Search articles, services and website pages.";

        }

      }

      catch(error){

        console.error(error);


        if(searchStatus){

          searchStatus.textContent =
            "Search is temporarily unavailable.";

        }

      }

    }


    /* OPEN SEARCH */

    async function openSearch(){

      if(!searchPanel){
        return;
      }


      searchPanel.hidden = false;


      document.body
        .classList
        .add("search-open");


      if(searchToggle){

        searchToggle
          .setAttribute(
            "aria-expanded",
            "true"
          );

      }


      /* CLOSE MOBILE MENU */

      if(
        window.innerWidth <= 900
      ){

        if(primaryNav){

          primaryNav
            .classList
            .remove("is-open");

        }


        if(menuToggle){

          menuToggle
            .classList
            .remove("is-open");

          menuToggle
            .setAttribute(
              "aria-expanded",
              "false"
            );

        }

      }


      await loadSearchData();


      setTimeout(
        function(){

          if(searchInput){
            searchInput.focus();
          }

        },
        50
      );

    }


    /* CLOSE SEARCH */

    function closeSearch(){

      if(!searchPanel){
        return;
      }


      searchPanel.hidden = true;


      document.body
        .classList
        .remove("search-open");


      if(searchToggle){

        searchToggle
          .setAttribute(
            "aria-expanded",
            "false"
          );

      }

    }


    /* SEARCH FUNCTION */

    function performSearch(query){

      if(
        !searchResults ||
        !searchStatus
      ){
        return;
      }


      searchResults.innerHTML = "";


      const cleanQuery =
        query
          .trim()
          .toLowerCase();


      if(
        cleanQuery.length < 2
      ){

        searchStatus.textContent =
          "Type at least 2 characters to search.";

        return;

      }


      const words =
        cleanQuery
          .split(/\s+/)
          .filter(Boolean);


      const matches =
        searchData

          .map(function(item){

            const title =
              (item.title || "")
                .toLowerCase();

            const description =
              (item.description || "")
                .toLowerCase();

            const content =
              (item.content || "")
                .toLowerCase();


            let score = 0;


            words.forEach(
              function(word){

                if(
                  title.includes(word)
                ){
                  score += 10;
                }


                if(
                  description.includes(word)
                ){
                  score += 5;
                }


                if(
                  content.includes(word)
                ){
                  score += 1;
                }

              }
            );


            return {

              item: item,

              score: score

            };

          })


          .filter(
            function(result){

              return (
                result.score > 0
              );

            }
          )


          .sort(
            function(a,b){

              return (
                b.score - a.score
              );

            }
          )


          .slice(
            0,
            10
          );


      if(
        matches.length === 0
      ){

        searchStatus.textContent =
          'No results found for "' +
          query.trim() +
          '".';

        return;

      }


      searchStatus.textContent =
        matches.length +

        (
          matches.length === 1
          ? " result found"
          : " results found"
        );


      matches.forEach(
        function(result){

          const item =
            result.item;


          const resultCard =
            document.createElement(
              "a"
            );


          resultCard.className =
            "site-search-result";


          resultCard.href =
            item.url || "/";


          const title =
            document.createElement(
              "h3"
            );


          title.textContent =
            item.title ||
            "Untitled";


          const description =
            document.createElement(
              "p"
            );


          description.textContent =
            item.description ||
            "Open this page to learn more.";


          const linkText =
            document.createElement(
              "span"
            );


          linkText.className =
            "site-search-result-link";


          linkText.textContent =
            "View Page →";


          resultCard
            .appendChild(title);


          resultCard
            .appendChild(
              description
            );


          resultCard
            .appendChild(
              linkText
            );


          searchResults
            .appendChild(
              resultCard
            );

        }
      );

    }


    /* SEARCH BUTTON */

    if(searchToggle){

      searchToggle.addEventListener(
        "click",
        function(){

          if(
            searchPanel &&
            searchPanel.hidden
          ){

            openSearch();

          }

          else{

            closeSearch();

          }

        }
      );

    }


    /* CLOSE BUTTON */

    if(searchClose){

      searchClose.addEventListener(
        "click",
        closeSearch
      );

    }


    /* LIVE SEARCH */

    if(searchInput){

      searchInput.addEventListener(
        "input",
        function(){

          performSearch(
            searchInput.value
          );

        }
      );

    }


    /* ESCAPE CLOSE */

    document.addEventListener(
      "keydown",
      function(event){

        if(
          event.key === "Escape" &&
          searchPanel &&
          !searchPanel.hidden
        ){

          closeSearch();

        }

      }
    );


    /* CLOSE AFTER RESULT CLICK */

    if(searchResults){

      searchResults.addEventListener(
        "click",
        function(event){

          const link =
            event.target.closest(
              ".site-search-result"
            );


          if(link){

            closeSearch();

          }

        }
      );

    }

  }
);
</script>


</body>
</html>
